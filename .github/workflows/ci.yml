name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-ubuntu:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            libgstreamer-plugins-bad1.0-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # jj tier tests build fixtures with the jj CLI; version must match the
      # jj-lib pin in src-tauri/Cargo.toml.
      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.43.0/jj-v0.43.0-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version

      - name: Install Node dependencies
        run: pnpm install

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        run: pnpm test:rust

      - name: Build
        run: pnpm tauri build --debug

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # jj tier tests build fixtures with the jj CLI; version must match the
      # jj-lib pin in src-tauri/Cargo.toml.
      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.43.0/jj-v0.43.0-aarch64-apple-darwin.tar.gz \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version

      - name: Install Node dependencies
        run: pnpm install

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        run: pnpm test:rust

      - name: Build
        run: pnpm tauri build --debug

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # jj tier tests build fixtures with the jj CLI; version must match the
      # jj-lib pin in src-tauri/Cargo.toml.
      - name: Install jj
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/jj-vcs/jj/releases/download/v0.43.0/jj-v0.43.0-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP\jj.zip"
          Expand-Archive "$env:RUNNER_TEMP\jj.zip" -DestinationPath "$env:RUNNER_TEMP\jj"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\jj"
          & "$env:RUNNER_TEMP\jj\jj.exe" --version

      - name: Install Node dependencies
        run: pnpm install

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        run: pnpm test:rust

      - name: Build
        run: pnpm tauri build --debug --no-bundle
